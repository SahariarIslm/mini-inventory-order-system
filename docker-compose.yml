# Values like ${DB_PASSWORD:-secret} come from the root .env when present and
# otherwise fall back to the same defaults as .env.example — so a fresh clone
# works with just `docker compose up --build -d`.
services:
  mysql:
    image: mysql:8.0
    container_name: mios_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mios}
      MYSQL_USER: ${DB_USERNAME:-mios_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mios_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mios_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mios_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mios_app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      # Anonymous volume: keeps the image's composer-installed vendor/ from
      # being hidden by the bind mount above (a fresh clone has no vendor/).
      # The entrypoint reinstalls if it drifts from composer.lock.
      - /var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mios}
      DB_USERNAME: ${DB_USERNAME:-mios_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
    # Healthy once the entrypoint has migrated/seeded and the server answers.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mios_network

  frontend:
    image: node:24-alpine
    container_name: mios_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      # Linux-built node_modules stay inside the container: native binaries
      # (rolldown, oxlint) must match the container OS, and it's much faster
      # than a Windows bind mount.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://app:8000
      VITE_USE_POLLING: "true"
    depends_on:
      - app
    networks:
      - mios_network

networks:
  mios_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules: